<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>올팍 주차예보</title>
<meta name="description" content="올림픽공원 공연 일정과 실시간 주차대수로 공연날 입차·출차가 몰리는 시간대를 알려 주는 웹 서비스 (한국체육산업개발(주) 공공데이터 활용)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%231d3b6e%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-size=%2219%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Arial%22 font-weight=%22700%22%3EP%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="assets/app.css?v=13">
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <div>
      <h1>올팍 주차예보</h1>
      <p class="sub">올림픽공원 공연날, 언제 차가 몰리고 언제 빠지는지</p>
    </div>
    <nav class="tabs" role="tablist" aria-label="화면">
      <button role="tab" aria-selected="true" data-tab="day">주차예보</button>
      <button role="tab" aria-selected="false" data-tab="ops">운영자 보기</button>
      <button role="tab" aria-selected="false" data-tab="proof">근거·검증</button>
      <button role="tab" aria-selected="false" data-tab="src">데이터 출처</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="live" aria-live="polite" id="live">
    <div class="live-l">
      <span class="live-label">지금 주차장(동2·남2·북2문)</span>
      <span class="live-num" id="liveNum">—</span>
      <span class="live-cap">/ 2,200대</span>
    </div>
    <div class="live-r">
      <span class="lvl" id="liveLvl">불러오는 중</span>
      <span class="live-time" id="liveTime"></span>
      <button class="ghost" id="liveRefresh" type="button">새로고침</button>
    </div>
  </section>

  <section id="tab-day" class="tab-panel">
    <div class="datebar" id="datebar" role="listbox" aria-label="날짜 고르기"></div>
    <div id="day"></div>
  </section>

  <section id="tab-ops" class="tab-panel" hidden>
    <h2>앞으로 8주 공연날 주차 대비표</h2>
    <p class="note">기관 공연 일정에서 대형 공연장(KSPO DOME·88잔디마당·티켓링크 라이브 아레나·올림픽홀) 회차가 있는 날만. 입차·출차 몰림은 2024년 7월 실측 근거(근거·검증 탭).</p>
    <div class="table-wrap"><table class="grid" id="opsTable"></table></div>
    <button class="ghost" id="opsCsv" type="button">표 CSV로 받기</button>
  </section>

  <section id="tab-proof" class="tab-panel" hidden>
    <div id="proof"></div>
  </section>

  <section id="tab-src" class="tab-panel" hidden>
    <div id="src"></div>
  </section>
</main>

<footer class="foot">
  <div class="wrap">
    <p>한국체육산업개발(주)가 개방한 공공데이터를 활용한 개인 개발 작품이며, 기관의 공식 서비스가 아닙니다. 실제 주차 상황은 현장 안내를 따르세요.</p>
    <p id="buildInfo"></p>
  </div>
</footer>
<script src="assets/app.js?v=13"></script>
</body>
</html>
